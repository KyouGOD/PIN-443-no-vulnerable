<!-- Баннер установки PWA -->
<div class="webview-install-container">
  <div class="webview-install-content">
    <div class="webview-install-header">
      <img src="favicon.ico" alt="Banking App" class="webview-install-icon">
      <div class="webview-install-text">
        <h3>Установите приложение Banking App</h3>
        <p>Получите доступ к банковским услугам без интерфейса браузера, прямо с рабочего стола или домашнего экрана</p>
      </div>
    </div>
    <div class="webview-install-info">
      <ul>
        <li>Быстрый доступ с главного экрана</li>
        <li>Работа в полноэкранном режиме без элементов браузера</li>
        <li>Улучшенный пользовательский опыт</li>
      </ul>
    </div>
    <div class="webview-install-actions">
      <button tuiButton type="button" appearance="primary" (click)="installApp()">Установить приложение</button>
      <button tuiButton type="button" appearance="flat" (click)="closePromotion()">Не сейчас</button>
    </div>
  </div>
</div>
