server {
    listen 80;
    server_name pin-443.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pin-443.ru;

    ssl_certificate /etc/letsencrypt/live/pin-443.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pin-443.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA route handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Используем HTTP вместо HTTPS для локального соединения с бэкендом
        # Убираем слеш в конце URL, чтобы сохранить оригинальный путь с /api/
        proxy_pass http://backend:8000;
        
        # Заголовки для прокси
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Явно указываем, что проксирование должно сохранять HTTPS
        proxy_redirect http:// https://;
    }

   #  # Cache static assets aggressively
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|svg|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        font/woff2;
    gzip_min_length 256;
    gzip_vary on;

}
